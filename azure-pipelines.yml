trigger:
  branches:
    include:
      - dev

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: vm-credentials   # VM_HOST, VM_USER, VM_PASSWORD

steps:
  - task: Maven@4
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean package'
    displayName: "Clean & Build Maven App"

  - script: |
      echo "=== Installing sshpass ==="
      sudo apt-get update -y
      sudo apt-get install -y sshpass

      echo "=== Deploying new JAR to VM ==="
      sshpass -p "$(VM_PASSWORD)" scp -o StrictHostKeyChecking=no target/maven-hello-azure-1.0-SNAPSHOT.jar $(VM_USER)@$(VM_HOST):/home/$(VM_USER)/app/hello.jar

      echo "=== Starting app on VM ==="
      sshpass -p "$(VM_PASSWORD)" ssh -o StrictHostKeyChecking=no $(VM_USER)@$(VM_HOST) "
        cd /home/fvm/app;
        echo 'Killing any old Java processes...';
        ps -ef | grep hello.jar | grep -v grep | awk '{print \$2}' | xargs -r kill -9;
        rm -f /home/fvm/app/output.log;
        echo 'Starting new app...';
        nohup java -cp /home/fvm/app/hello.jar com.example.App > /home/fvm/app/output.log 2>&1 &
        sleep 3;
        echo 'App restarted at:' \$(date);
        echo '--- Latest Output ---';
        tail -n 5 /home/fvm/app/output.log;
      "

      echo "=== Deployment completed successfully! ==="
    displayName: "Deploy and Run on Azure VM"
