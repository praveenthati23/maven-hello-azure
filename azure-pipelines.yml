trigger:
  branches:
    include:
      - dev

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: vm-credentials   # VM_HOST, VM_USER, VM_PASSWORD

steps:
  - task: Maven@4
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'package'
    displayName: "Build Maven App"

  - script: |
      echo "Installing sshpass..."
      sudo apt-get update -y
      sudo apt-get install -y sshpass

      echo "Testing SSH connectivity..."
      sshpass -p "$(VM_PASSWORD)" ssh -v -o StrictHostKeyChecking=no $(VM_USER)@$(VM_HOST) "echo 'Connected successfully to VM'"

      echo "Ensuring app directory exists..."
      sshpass -p "$(VM_PASSWORD)" ssh -o StrictHostKeyChecking=no $(VM_USER)@$(VM_HOST) "mkdir -p /home/fvm/app"

      echo "Deploying JAR to /home/fvm/app ..."
      sshpass -p "$(VM_PASSWORD)" scp -o StrictHostKeyChecking=no target/maven-hello-azure-1.0-SNAPSHOT.jar $(VM_USER)@$(VM_HOST):/home/fvm/app/hello.jar

      echo "Running app on VM..."
      sshpass -p "$(VM_PASSWORD)" ssh -o StrictHostKeyChecking=no $(VM_USER)@$(VM_HOST) "pkill -f 'java -cp' || true; nohup java -cp /home/fvm/app/hello.jar com.example.App > /home/fvm/app/output.log 2>&1 &"

      echo "Deployment completed successfully!"
    displayName: "Deploy and Run on Azure VM"
