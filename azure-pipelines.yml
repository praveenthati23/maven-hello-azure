trigger:
  branches:
    include:
      - dev

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: vm-credentials   # VM_HOST, VM_USER, VM_PASSWORD

steps:
  - task: Maven@4
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'package'
    displayName: "Build Maven App"

  - script: |
      echo "=== Installing sshpass ==="
      sudo apt-get update -y
      sudo apt-get install -y sshpass

      echo "=== Checking SSH connectivity ==="
      sshpass -p "$(VM_PASSWORD)" ssh -o StrictHostKeyChecking=no $(VM_USER)@$(VM_HOST) "echo 'Connected successfully to VM: ' \$(hostname)"

      echo "=== Ensuring /home/fvm/app directory exists ==="
      sshpass -p "$(VM_PASSWORD)" ssh -o StrictHostKeyChecking=no $(VM_USER)@$(VM_HOST) "mkdir -p /home/fvm/app"

      echo "=== Deploying latest JAR to VM ==="
      sshpass -p "$(VM_PASSWORD)" scp -o StrictHostKeyChecking=no target/maven-hello-azure-1.0-SNAPSHOT.jar $(VM_USER)@$(VM_HOST):/home/fvm/app/hello.jar

      echo "=== Starting the app automatically and saving logs ==="
      sshpass -p "$(VM_PASSWORD)" ssh -o StrictHostKeyChecking=no $(VM_USER)@$(VM_HOST) "
        cd /home/fvm/app;
        pkill -f 'java -cp' || true;
        rm -f /home/fvm/app/output.log;
        nohup java -cp /home/fvm/app/hello.jar com.example.App > /home/fvm/app/output.log 2>&1 &
        sleep 3;
        echo 'App started automatically at:' \$(date);
        echo '--- Recent Output ---';
        tail -n 5 /home/fvm/app/output.log;
      "

      echo "=== Deployment completed successfully! ==="
    displayName: "Deploy and Run on Azure VM"
